name: Kaykha CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Presentation boundary
        run: node scripts/static-audit.mjs presentation
      - name: Mobile controller
        run: node scripts/static-audit.mjs mobile
      - name: Rule authority
        run: node scripts/static-audit.mjs authority
      - name: Effect bus
        run: node scripts/static-audit.mjs effects
      - name: Generated online client
        run: node scripts/static-audit.mjs generated
      - name: Security invariants
        run: node scripts/static-audit.mjs security
      - name: Migration and runtime integrity
        run: node scripts/migration-integrity-audit.mjs
      - name: Architecture integrity
        run: node scripts/architecture-integrity.mjs
      - name: Assembled bundle
        run: node scripts/static-audit.mjs bundle
      - name: Runtime mode contract
        run: node scripts/runtime-mode-audit.mjs
      - name: Practice parity contract
        run: node scripts/practice-parity-audit.mjs
      - name: AI planner fairness and depth
        run: node scripts/ai-planner-audit.mjs
      - name: State sync contract
        run: node scripts/state-sync-audit.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Mobile shell scroll and navigation smoke
        run: node scripts/mobile-shell-e2e.mjs
      - name: Browser lobby and voice smoke
        run: node scripts/lobby-browser-e2e.mjs
      - name: Dual-browser join and voice flow
        run: node scripts/lobby-dual-browser-e2e.mjs
      - name: Live authoritative rule smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/live-rule-smoke.mjs
