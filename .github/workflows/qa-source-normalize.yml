name: Kaykha QA Source Normalize

on:
  push:
    branches: [qa/priority-fixes-20260917]
    paths:
      - scripts/source-normalize-qa.mjs
      - .github/workflows/qa-source-normalize.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/priority-fixes-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Normalize canonical source
        run: node scripts/source-normalize-qa.mjs
      - name: Verify patch
        run: git diff --check
      - name: Commit normalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/kaykha-shared-engine-client.js api/kaykha-phase5-interaction-fix.js api/kaykha-online.js index.js
          git commit -m "refactor: move QA fixes into canonical source"
          git push origin HEAD:qa/priority-fixes-20260917
