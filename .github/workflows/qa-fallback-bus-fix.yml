name: Kaykha QA Fallback Bus Fix

on:
  push:
    branches: [qa/priority-fixes-20260917]
    paths:
      - scripts/source-fix-fallback-bus.mjs
      - .github/workflows/qa-fallback-bus-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/priority-fixes-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Move fallback sync to canonical bus
        run: node scripts/source-fix-fallback-bus.mjs
      - name: Verify patch
        run: git diff --check
      - name: Commit canonical source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/kaykha-shared-engine-client.js
          git commit -m "fix: use canonical sync bus for realtime fallback"
          git push origin HEAD:qa/priority-fixes-20260917
